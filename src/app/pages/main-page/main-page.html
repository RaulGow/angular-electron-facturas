<div class="main-page">
    <div class="header">
        <div class="header-left">
            <h1>Panel de Control</h1>
            <p>Bienvenido al sistema de facturación</p>
        </div>




        <div class="header-right">
            <p class="date">{{ fechaFormateada }}</p>
        </div>
    </div>
    <div class="dashboard-sumary">
        <app-card-summary
          link="/articulos"
          iconSrc="assets/icons/database-line.svg"
          title="Artículos">
        </app-card-summary>

        <app-card-summary
          link="/clientes"
          iconSrc="assets/icons/user-settings-line.svg"
          title="Clientes">
        </app-card-summary>

        <app-card-summary
          link="/facturas"
          iconSrc="assets/icons/file-pdf-2-line.svg"
          title="Facturas">
        </app-card-summary>

        <app-card-summary
          link="/graficos"
          iconSrc="assets/icons/line-chart-fill.svg"
          title="Gráficos">
        </app-card-summary>

        <app-card-summary
          link="/graficos"
          iconSrc="assets/icons/currency-line.svg"
          title="Caja">
        </app-card-summary>
    </div>
    <div class="actions">
        <app-action-button
            label="Generar Factura"
            size="normal"
            icon="assets/icons/delete-bin-2-line.svg"
            variant="primary"
            [isWhiteIcon]="true"
            routerLink="/generar"
        ></app-action-button>
    </div>
    <div class="sumary">
        <table class="sumary-table">
            <thead>
                <tr>
                    <th>Factura Nº</th>
                    <th>Cliente</th>
                    <th>CIF</th>
                    <th>Fecha</th>
                    <th>Tlfno.</th>
                    <th>Importe</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="sumary-table-number">Fact-0001</td>
                    <td>Pizzeria Kronos</td>
                    <td>X-123589647</td>
                    <td>15/01/2026</td>
                    <td>914785987</td>
                    <td class="sumary-table-price">750.00€</td>
                    <td>
                        <div class="table-row-actions">
                            <app-action-button
                                label="Imprimir"
                                size="small"
                                icon="assets/icons/printer-line.svg"
                                variant="primary"
                                [isWhiteIcon]="true"
                            ></app-action-button>
                            <app-action-button
                                label="Ver"
                                size="small"
                                icon="assets/icons/eye-line.svg"
                                variant="secondary"
                            ></app-action-button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
