<div class="field-wrapper" [class.has-error]="error()" [class.is-disabled]="isDisabled()">
  <div class="label-row">
    <label [for]="selectId">{{ label() }}</label>
    @if (error()) {
      <span class="error-badge">Requerido</span>
    }
  </div>
  
  <div class="input-container">
    <input
      type="text"
      [id]="selectId"
      [disabled]="isDisabled()"
      [value]="searchTerm()"
      (input)="onInput($event)"
      (focus)="onFocus($event)"
      [placeholder]="placeholder()"
      class="input-control select-control"
      autocomplete="off"
    >
    
    <span class="select-arrow" (click)="toggleDropdown($event)">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"
           [style.transform]="isOpen() ? 'rotate(180deg)' : 'none'" 
           style="transition: transform 0.2s;">
        <path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>

    @if (isOpen()) {
      <ul class="dropdown-list">
        @if (filteredOptions().length === 0) {
          <li class="dropdown-item no-results">No hay coincidencias</li>
        }
        @for (option of filteredOptions(); track option.id) {
          <li 
            class="dropdown-item" 
            [class.selected]="option.id === internalValue()"
            (mousedown)="selectOption(option, $event)"
          >
            {{ option.nombre }}
          </li>
        }
      </ul>
    }
  </div>

  @if (error()) {
    <p class="error-text" role="alert">{{ error() }}</p>
  }
</div>
